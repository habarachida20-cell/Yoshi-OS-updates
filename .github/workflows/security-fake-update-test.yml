name: Yoshi OS Fake Update Security Test

on:
  push:
    paths:
      - "tests/security/**"
      - "updater/anti-fake-update.h"
      - ".github/workflows/security-fake-update-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-update:
    name: Test fake update safely
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate fake update
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("tests/security/fake-update-payload.json").read_text(encoding="utf-8"))
          assert data["simulation"] is True
          assert data["signature"] is None
          assert data["creator"] is None
          e = data["expected"]
          assert e["download"] is False
          assert e["install"] is False
          assert e["quarantine"] is True
          assert e["emergency_mode"] is True
          assert e["sandbox_modified"] is False
          print("FAUSSE MISE A JOUR : REFUSEE")

      - name: Run isolated sandbox test
        run: |
          python3 - <<'PY'
          import json, tempfile
          from pathlib import Path
          payload = json.loads(Path("tests/security/fake-update-payload.json").read_text(encoding="utf-8"))
          target = Path("tests/security/sandbox/README.txt")
          before = target.read_bytes()
          with tempfile.TemporaryDirectory(prefix="yoshi-fake-update-") as d:
              q = Path(d) / "quarantine"
              q.mkdir()
              if payload["signature"] is None:
                  (q / "fake-update.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          assert target.read_bytes() == before
          print("Téléchargement : BLOQUE")
          print("Installation : BLOQUEE")
          print("Quarantaine : OK")
          print("Sandbox : INCHANGE")
          print("TEST REUSSI")
          PY
