name: build-final-pc

on:
  workflow_dispatch:
  push:
    paths:
      - 'pc/**'
      - '.github/workflows/build-final-pc.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows application
        run: dotnet publish pc/YoshiOS.FinalStatus.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o out

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: YoshiOS-FinalStatus-Windows-x64
          path: out/YoshiOS-FinalStatus.exe
